<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Daftar Tugas</h1>
        <form id="form-tugas">
            <input type="text" id="input-tugas" placeholder="Tulis tugas baru...." required>
            <button type="submit">Tambah</button>
        </form>
        <p id="penghitung">Belum ada tugas.</p>
        <ul id="daftar-tugas"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
